<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ania's Digi Mail Club — Your Package</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   DESIGN TOKENS
   ============================================================================ */
:root{
  --cream:#F4EBE1;
  --cardboard-light:#D8B284;
  --cardboard-dark:#C69C6D;
  --cardboard-shadow:#A9805B;
  --ink:#2A2A2A;
  --stamp-red:#C84B31;
  --tape:rgba(238,225,201,0.55);
  --tape-edge:rgba(160,130,95,0.55);
  --paper:#FFFDF8;
  --paper-line:#E7DCCB;

  --font-type:'Courier Prime', monospace;
  --font-serif:'Libre Baskerville', serif;
  --font-hand:'Caveat', cursive;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 45%),
    var(--cream);
  color:var(--ink);
  font-family:var(--font-type);
  overflow-x:hidden;
}

button{font-family:inherit;cursor:pointer;}

/* subtle grain/paper texture overlay so nothing feels flat */
body::before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;
  background-image:radial-gradient(rgba(42,42,42,0.035) 1px, transparent 1px);
  background-size:3px 3px;
  z-index:1;
  opacity:0.6;
}

.scene{
  position:relative;
  width:100%;
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:40px 20px 80px;
}
.scene.active{display:flex;}

/* ============================================================================
   SCENE 1 — THE UNOPENED PACKAGE
   ============================================================================ */
.package-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:34px;
  z-index:2;
}

.parcel{
  perspective:1200px;
}

.parcel-box{
  position:relative;
  width:min(78vw, 340px);
  aspect-ratio:1/1;
  background:
    repeating-linear-gradient(115deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 10px),
    linear-gradient(155deg, var(--cardboard-light), var(--cardboard-dark) 70%);
  border-radius:6px;
  box-shadow:
    0 18px 0 -6px var(--cardboard-shadow),
    0 24px 40px rgba(75,55,30,0.35);
  transition:transform 0.5s ease;
}

/* corrugated cardboard edge lines */
.parcel-box::before{
  content:"";
  position:absolute; inset:10px;
  border:2px solid rgba(90,62,32,0.18);
  border-radius:3px;
  pointer-events:none;
}

/* top flaps, hinged at the box edge, open like a real box lid */
.flap{
  position:absolute;
  top:-2px; width:52%; height:38%;
  background:linear-gradient(180deg, var(--cardboard-light), var(--cardboard-dark));
  border:2px solid rgba(90,62,32,0.18);
  transform-origin:top center;
  transition:transform 0.7s cubic-bezier(.6,-0.1,.35,1.4);
  z-index:3;
}
.flap-left{ left:-2px; border-radius:3px 0 12px 30%; transform:rotateX(0deg);}
.flap-right{ right:-2px; border-radius:0 3px 30% 12px; transform:rotateX(0deg) scaleX(-1);}

.parcel.opening .flap-left{ transform:rotateX(150deg) translateY(-6px); }
.parcel.opening .flap-right{ transform:rotateX(150deg) scaleX(-1) translateY(-6px); }
.parcel.opening .parcel-box{ transform: translateY(10px) scale(0.98); }

/* packaging tape running down the middle */
.tape-vertical{
  position:absolute; left:50%; top:-6px; bottom:-6px;
  width:15%; transform:translateX(-50%);
  background:var(--tape);
  border-left:2px dashed var(--tape-edge);
  border-right:2px dashed var(--tape-edge);
  z-index:4;
  transition:transform 0.6s ease, opacity 0.5s ease;
}
.parcel.opening .tape-vertical{ transform:translateX(-50%) scaleY(0.4); opacity:0; }

/* the shipping label sits on top of the box, tucked under the tape */
.shipping-label{
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%,-50%) rotate(-1.2deg);
  width:78%;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:2px;
  padding:14px 14px 10px;
  z-index:2;
  box-shadow:0 6px 14px rgba(0,0,0,0.18);
  transition:opacity 0.4s ease, transform 0.5s ease;
}
.parcel.opening .shipping-label{ opacity:0; transform:translate(-50%,-50%) rotate(-1.2deg) scale(0.9); }

.label-header{
  font-family:var(--font-type);
  font-weight:700;
  font-size:0.72rem;
  letter-spacing:0.08em;
  text-align:center;
  border-bottom:1px dashed var(--ink);
  padding-bottom:6px;
  margin-bottom:6px;
}
.label-month{
  font-family:var(--font-serif);
  font-style:italic;
  text-align:center;
  font-size:0.85rem;
  margin-bottom:8px;
}
.label-row{
  font-size:0.68rem;
  line-height:1.5;
  margin-bottom:2px;
}
.label-row b{font-weight:700;}

.stamp-badge{
  position:absolute;
  top:-14px; right:-10px;
  width:88px; height:88px;
  border-radius:50%;
  border:2.5px solid var(--stamp-red);
  color:var(--stamp-red);
  display:flex; align-items:center; justify-content:center;
  text-align:center;
  font-size:0.5rem;
  font-weight:700;
  letter-spacing:0.02em;
  line-height:1.15;
  padding:8px;
  transform:rotate(14deg);
  background:rgba(200,75,49,0.04);
  text-transform:lowercase;
  font-family:var(--font-type);
}

.barcode-block{margin-top:8px;text-align:center;}
.barcode-bars{
  display:flex; align-items:flex-end; justify-content:center;
  height:26px; gap:1px; margin-bottom:2px;
}
.barcode-bars span{ display:inline-block; background:var(--ink); height:100%; }
.tracking-number{
  font-size:0.62rem; letter-spacing:0.08em;
  cursor:default;
  user-select:none;
}

.open-btn{
  font-family:var(--font-type);
  font-weight:700;
  font-size:0.95rem;
  letter-spacing:0.03em;
  background:var(--paper);
  color:var(--ink);
  border:2px solid var(--ink);
  border-radius:30px;
  padding:14px 32px;
  box-shadow:3px 3px 0 var(--ink);
  transition:transform 0.15s ease, box-shadow 0.15s ease, opacity 0.3s ease;
}
.open-btn:hover{ transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink); }
.open-btn:active{ transform:translate(0,0); box-shadow:1px 1px 0 var(--ink); }
.parcel-wrap.hide-btn .open-btn{opacity:0; pointer-events:none;}

/* scatter layer: little goodies that pop out during opening */
#scatter-layer{
  position:absolute; inset:0;
  pointer-events:none;
  z-index:5;
}
.scatter-item{
  position:absolute;
  left:50%; top:44%;
  font-size:2rem;
  opacity:0;
  transform:translate(-50%,-50%) scale(0.4) rotate(0deg);
  transition:transform 1s cubic-bezier(.2,.8,.2,1), opacity 0.9s ease;
}
.scatter-item.fly{
  opacity:1;
  transform:translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1) rotate(var(--rot));
}
.scatter-item.settle{ opacity:0; }

/* ============================================================================
   SCENE 2 — YOUR LITTLE BOX OF GOODIES
   ============================================================================ */
.goodies-title{
  font-family:var(--font-serif);
  font-style:italic;
  font-size:clamp(1.7rem, 4vw, 2.4rem);
  margin:0 0 4px;
  text-align:center;
}
.goodies-sub{
  font-size:0.85rem;
  color:#5c5347;
  margin-bottom:34px;
  text-align:center;
}

.goodies-grid{
  width:100%;
  max-width:1080px;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
  gap:36px 28px;
  z-index:2;
}

.goodie-card{
  position:relative;
  background:var(--paper);
  border:1px solid var(--paper-line);
  border-radius:3px;
  padding:20px 18px 22px;
  box-shadow:0 10px 22px rgba(75,55,30,0.14);
  transform:rotate(var(--tilt, -1.2deg));
  transition:transform 0.25s ease, box-shadow 0.25s ease;
}
.goodie-card:hover{ transform:rotate(0deg) translateY(-3px); box-shadow:0 16px 28px rgba(75,55,30,0.2); }
.goodie-card:nth-child(3n+1){--tilt:-1.6deg;}
.goodie-card:nth-child(3n+2){--tilt:1.3deg;}
.goodie-card:nth-child(3n){--tilt:-0.6deg;}

/* translucent tape holding each card down */
.card-tape{
  position:absolute; top:-10px; left:50%;
  width:70px; height:26px;
  transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(100deg, var(--tape) 0 6px, rgba(238,225,201,0.4) 6px 12px);
  border-left:1px dashed var(--tape-edge);
  border-right:1px dashed var(--tape-edge);
  opacity:0.9;
}

.goodie-kicker{
  font-size:0.62rem; letter-spacing:0.05em; color:#8a7c68;
  margin-bottom:6px;
}
.goodie-title{
  font-family:var(--font-serif);
  font-size:1.15rem;
  margin:0 0 8px;
}
.goodie-desc{
  font-size:0.82rem; line-height:1.5; color:#3d372e; margin:0 0 12px;
}
.goodie-note{
  font-family:var(--font-hand);
  font-size:1.35rem; line-height:1.35;
  color:var(--ink);
  white-space:pre-wrap;
  margin:6px 0 4px;
}
.goodie-image{
  width:100%; border-radius:2px; margin-bottom:10px; display:block;
  border:1px solid var(--paper-line);
}

.goodie-btn{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-type); font-weight:700; font-size:0.72rem;
  letter-spacing:0.03em;
  background:var(--cream);
  border:1.5px solid var(--ink);
  border-radius:20px;
  padding:8px 16px;
  color:var(--ink);
  text-decoration:none;
  transition:transform 0.15s ease;
}
.goodie-btn:hover{ transform:translateY(-2px); }

.photocard-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:6px;
  margin-bottom:10px;
}
.photocard-thumb{
  width:100%; aspect-ratio:1/1.2; object-fit:cover;
  border-radius:2px; border:1px solid var(--paper-line);
  cursor:zoom-in;
  transition:transform 0.15s ease;
}
.photocard-thumb:hover{ transform:scale(1.04); }

.custom-list{ margin:0 0 10px; padding-left:18px; font-size:0.82rem; line-height:1.6; }

/* ============================================================================
   PHOTOCARD / IMAGE MODAL (LIGHTBOX)
   ============================================================================ */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(20,16,10,0.78);
  display:none;
  align-items:center; justify-content:center;
  z-index:100;
  padding:24px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  position:relative;
  max-width:min(88vw, 480px);
  text-align:center;
}
.modal-box img{
  width:100%; max-height:74vh; object-fit:contain;
  border:4px solid var(--paper);
  border-radius:2px;
  background:var(--paper);
}
#modal-close{
  position:absolute; top:-38px; right:0;
  background:none; border:none; color:var(--paper);
  font-size:1.8rem; line-height:1;
}
.modal-nav{
  margin-top:12px; display:flex; align-items:center; justify-content:center; gap:18px;
  color:var(--paper); font-family:var(--font-type); font-size:0.85rem;
}
.modal-nav button{
  background:none; border:1.5px solid var(--paper); color:var(--paper);
  border-radius:50%; width:34px; height:34px; font-size:1rem;
}

/* ============================================================================
   SECRET ADMIN DOOR
   ============================================================================ */
#admin-trigger{
  position:fixed; bottom:10px; right:10px;
  width:26px; height:26px;
  z-index:50;
  cursor:default;
  /* intentionally invisible — this is the "secret door".
     Click it 5 times in a row to summon the admin panel. */
}

.admin-overlay{
  position:fixed; inset:0;
  background:rgba(20,16,10,0.6);
  display:none;
  align-items:flex-start; justify-content:center;
  overflow-y:auto;
  z-index:200;
  padding:40px 16px;
}
.admin-overlay.open{display:flex;}
.admin-panel{
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:6px;
  max-width:640px; width:100%;
  padding:26px 24px 32px;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
}
.admin-panel h2{ font-family:var(--font-serif); margin-top:0; }
.admin-panel h3{ font-family:var(--font-serif); font-size:1rem; margin:22px 0 8px; border-top:1px dashed var(--paper-line); padding-top:16px;}
.admin-field{ margin-bottom:12px; }
.admin-field label{ display:block; font-size:0.72rem; font-weight:700; margin-bottom:4px; letter-spacing:0.02em;}
.admin-field input, .admin-field select, .admin-field textarea{
  width:100%; font-family:var(--font-type); font-size:0.85rem;
  padding:8px 10px; border:1.5px solid var(--ink); border-radius:3px; background:#fff;
}
.admin-field textarea{ min-height:70px; resize:vertical; }
.admin-item-block{
  border:1px solid var(--paper-line); border-radius:4px; padding:14px; margin-bottom:14px; background:#fffefb;
}
.admin-item-block .admin-item-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.admin-item-block .admin-item-head span{font-weight:700; font-size:0.78rem;}
.admin-btn{
  font-family:var(--font-type); font-weight:700; font-size:0.75rem;
  border:1.5px solid var(--ink); background:var(--cream); border-radius:20px;
  padding:8px 16px; margin:4px 6px 4px 0;
}
.admin-btn.danger{ background:#f6e2dd; border-color:var(--stamp-red); color:var(--stamp-red); }
.admin-btn.primary{ background:var(--ink); color:var(--paper); }
.admin-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; }
.admin-export{ width:100%; min-height:160px; font-family:var(--font-type); font-size:0.72rem; margin-top:10px; }
.admin-passcode-gate{ text-align:center; padding:20px 0; }

/* ============================================================================
   RESPONSIVE
   ============================================================================ */
@media (max-width: 480px){
  .goodies-grid{ grid-template-columns:1fr; }
  .stamp-badge{ width:74px; height:74px; font-size:0.44rem; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
}
</style>
</head>
<body>

<div id="app">

  <!-- ============== SCENE 1: THE UNOPENED PACKAGE ============== -->
  <section id="package-scene" class="scene active">
    <div class="package-wrap" id="parcel-wrap">
      <div class="parcel" id="parcel">
        <div id="scatter-layer"></div>
        <div class="parcel-box">
          <div class="flap flap-left"></div>
          <div class="flap flap-right"></div>
          <div class="shipping-label" id="shipping-label">
            <div class="label-header">DIGITAL CARE PACKAGE</div>
            <div class="label-month" id="label-month"></div>
            <div class="label-row"><b>TO:</b> <span id="label-to"></span></div>
            <div class="label-row"><b>FROM:</b> <span id="label-from"></span></div>
            <div class="barcode-block">
              <div class="barcode-bars" id="barcode-bars"></div>
              <div class="tracking-number" id="label-tracking"></div>
            </div>
            <div class="stamp-badge">to be delivered<br>with care<br>&amp; love</div>
          </div>
          <div class="tape-vertical"></div>
        </div>
      </div>
      <button class="open-btn" id="open-btn">OPEN YOUR PACKAGE ♡</button>
    </div>
  </section>

  <!-- ============== SCENE 2: YOUR LITTLE BOX OF GOODIES ============== -->
  <section id="goodies-scene" class="scene">
    <h1 class="goodies-title">your little box of goodies</h1>
    <p class="goodies-sub" id="goodies-sub">everything packed for you this month</p>
    <div class="goodies-grid" id="goodies-grid"></div>
  </section>

</div>

<!-- Photocard / image lightbox -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button id="modal-close">&times;</button>
    <img id="modal-img" src="" alt="">
    <div class="modal-nav">
      <button id="modal-prev">‹</button>
      <span id="modal-count"></span>
      <button id="modal-next">›</button>
    </div>
  </div>
</div>

<!-- The secret door: click this invisible corner spot 5x to open admin -->
<div id="admin-trigger"></div>

<!-- Admin panel -->
<div class="admin-overlay" id="admin-overlay">
  <div class="admin-panel" id="admin-panel">
    <!-- filled in by JS: passcode gate first, then the editor -->
  </div>
</div>

<script>
/* ============================================================================
   THIS MONTH'S MAIL CONFIGURATION
   EDIT THIS SECTION ONLY TO CREATE EACH MEMBER'S PACKAGE!
   (You can also edit all of this live from the Admin panel — see the very
   bottom of this file for how to open it — and export updated code from there.)
   ============================================================================ */
const PACKAGE_DATA = {

  // ---- shipping label info ----
  toName: "Maya",
  fromName: "Ania's Digi Mail Club",
  month: "OCTOBER 2026",
  trackingNumber: "9405 5118 9956 1891 2345 67",

  // ---- the goodies inside, in the order they should appear ----
  // supported "type" values: TEXT, PHOTOCARD_SET, LINK, DOWNLOAD, CUSTOM
  items: [
    {
      id: "letter-01",
      type: "TEXT",
      title: "A little note for you",
      description: "",
      text: "hi maya! i hope october has been soft and slow for you.\nthis box has a few things i thought you'd like <3\n\n— ania",
      image: ""
    },
    {
      id: "photos-01",
      type: "PHOTOCARD_SET",
      title: "Photocards from this month",
      description: "tap any card to see it up close",
      photocards: [
        "https://images.unsplash.com/photo-1517816428104-797678c7cf0c?w=600",
        "https://images.unsplash.com/photo-1500462918059-b1a0cb512f1d?w=600",
        "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600",
        "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600",
        "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600",
        "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=600",
        "https://images.unsplash.com/photo-1441057206919-63d19fac2369?w=600"
      ]
    },
    {
      id: "playlist-01",
      type: "LINK",
      title: "October's playlist",
      description: "cozy songs for rainy afternoons",
      link: "https://open.spotify.com",
      buttonLabel: "Listen now"
    },
    {
      id: "wallpaper-01",
      type: "DOWNLOAD",
      title: "Phone wallpaper",
      description: "a little something for your lock screen",
      link: "https://images.unsplash.com/photo-1495756111155-cb0d2df85332?w=1200",
      buttonLabel: "Download",
      downloadable: true
    },
    {
      id: "custom-01",
      type: "CUSTOM",
      title: "What's in my cart right now",
      description: "just some things i've been eyeing lately",
      text: [
        "a cinnamon candle",
        "that green cardigan i keep going back to",
        "a new notebook (i don't need it, i just want it)"
      ]
    }
  ]
};

// ============================================================================
// DO NOT EDIT BELOW — rendering, animation, and admin logic
// ============================================================================

/* ---------------------------------------------------------------------------
   Working copy of the data. The admin panel edits THIS, not the constant
   above, so you can preview changes live before exporting the final code.
--------------------------------------------------------------------------- */
let currentData = JSON.parse(JSON.stringify(PACKAGE_DATA));

/* ---------------------------------------------------------------------------
   LABEL + BARCODE RENDERING
--------------------------------------------------------------------------- */
function renderLabel(){
  document.getElementById('label-month').textContent = currentData.month;
  document.getElementById('label-to').textContent = currentData.toName;
  document.getElementById('label-from').textContent = currentData.fromName;
  document.getElementById('label-tracking').textContent = currentData.trackingNumber;
  renderBarcode(currentData.trackingNumber);
  document.getElementById('goodies-sub').textContent =
    "everything " + currentData.fromName.split("'")[0] + " packed for " + currentData.toName + " this month";
}

// Purely decorative barcode built deterministically from the tracking number
// (not a real scannable code — just for the parcel aesthetic).
function renderBarcode(str){
  const holder = document.getElementById('barcode-bars');
  holder.innerHTML = '';
  const chars = (str || '000000').replace(/\s/g, '').split('');
  chars.forEach((ch, i) => {
    const code = ch.charCodeAt(0);
    const bar = document.createElement('span');
    bar.style.width = (2 + (code % 3)) + 'px';
    bar.style.height = (40 + (code * (i + 1)) % 60) + '%';
    bar.style.marginRight = (code % 2 === 0 ? '1px' : '2px');
    holder.appendChild(bar);
  });
}

/* ---------------------------------------------------------------------------
   GOODIES GRID RENDERING — dynamic, handles any number of items,
   and dispatches per item "type".
--------------------------------------------------------------------------- */
function renderGoodies(){
  const grid = document.getElementById('goodies-grid');
  grid.innerHTML = '';
  currentData.items.forEach(item => {
    const card = document.createElement('article');
    card.className = 'goodie-card';
    card.innerHTML = '<div class="card-tape"></div>' + renderItemInner(item);
    grid.appendChild(card);
  });
  attachPhotocardHandlers();
}

function escapeHtml(str){
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderItemInner(item){
  const kicker = '<div class="goodie-kicker">' + escapeHtml(item.type.replace('_',' ')) + '</div>';
  const title = item.title ? '<h3 class="goodie-title">' + escapeHtml(item.title) + '</h3>' : '';
  const desc = item.description ? '<p class="goodie-desc">' + escapeHtml(item.description) + '</p>' : '';
  const image = item.image ? '<img class="goodie-image" src="' + item.image + '" alt="">' : '';

  switch(item.type){

    case 'TEXT': {
      const note = item.text ? '<div class="goodie-note">' + escapeHtml(item.text) + '</div>' : '';
      return kicker + title + image + note + desc;
    }

    case 'PHOTOCARD_SET': {
      const cards = (item.photocards || []);
      const thumbs = cards.map((src, i) =>
        '<img class="photocard-thumb" data-set="' + item.id + '" data-index="' + i + '" src="' + src + '" alt="photocard">'
      ).join('');
      return kicker + title + desc +
        '<div class="photocard-grid" id="grid-' + item.id + '">' + thumbs + '</div>';
    }

    case 'LINK': {
      const label = item.buttonLabel || 'Open link';
      const btn = item.link ? '<a class="goodie-btn" href="' + item.link + '" target="_blank" rel="noopener">' + escapeHtml(label) + ' ↗</a>' : '';
      return kicker + title + image + desc + btn;
    }

    case 'DOWNLOAD': {
      const label = item.buttonLabel || 'Download';
      const dl = item.downloadable ? ' download' : '';
      const btn = item.link ? '<a class="goodie-btn" href="' + item.link + '"' + dl + ' target="_blank" rel="noopener">' + escapeHtml(label) + ' ⬇</a>' : '';
      return kicker + title + image + desc + btn;
    }

    case 'CUSTOM': {
      let body = '';
      if (Array.isArray(item.text)){
        body = '<ul class="custom-list">' + item.text.map(t => '<li>' + escapeHtml(t) + '</li>').join('') + '</ul>';
      } else if (item.text){
        body = '<div class="goodie-note">' + escapeHtml(item.text) + '</div>';
      }
      const label = item.buttonLabel && item.link
        ? '<a class="goodie-btn" href="' + item.link + '" target="_blank" rel="noopener">' + escapeHtml(item.buttonLabel) + ' ↗</a>'
        : '';
      return kicker + title + image + desc + body + label;
    }

    default:
      return kicker + title + desc;
  }
}

/* ---------------------------------------------------------------------------
   PHOTOCARD LIGHTBOX
--------------------------------------------------------------------------- */
let modalSet = [];
let modalIndex = 0;

function attachPhotocardHandlers(){
  document.querySelectorAll('.photocard-thumb').forEach(thumb => {
    thumb.addEventListener('click', () => {
      const setId = thumb.getAttribute('data-set');
      const item = currentData.items.find(i => i.id === setId);
      modalSet = item.photocards || [];
      modalIndex = parseInt(thumb.getAttribute('data-index'), 10);
      openModal();
    });
  });
}

function openModal(){
  document.getElementById('modal-img').src = modalSet[modalIndex];
  document.getElementById('modal-count').textContent = (modalIndex + 1) + ' / ' + modalSet.length;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }
function stepModal(dir){
  modalIndex = (modalIndex + dir + modalSet.length) % modalSet.length;
  openModal();
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-prev').addEventListener('click', () => stepModal(-1));
document.getElementById('modal-next').addEventListener('click', () => stepModal(1));
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target.id === 'modal-overlay') closeModal();
});

/* ---------------------------------------------------------------------------
   OPENING ANIMATION
--------------------------------------------------------------------------- */
const SCATTER_EMOJI = ['💌','🎀','📷','🎵','🌸','📎','✂️','🧷'];

function playOpeningAnimation(){
  const parcel = document.getElementById('parcel');
  const wrap = document.getElementById('parcel-wrap');
  parcel.classList.add('opening');
  wrap.classList.add('hide-btn');

  const scatterLayer = document.getElementById('scatter-layer');
  scatterLayer.innerHTML = '';

  const count = Math.min(8, Math.max(4, currentData.items.length));
  for (let i = 0; i < count; i++){
    const el = document.createElement('div');
    el.className = 'scatter-item';
    el.textContent = SCATTER_EMOJI[i % SCATTER_EMOJI.length];
    const angle = (Math.PI * 2 * i / count) + (Math.random() * 0.6 - 0.3);
    const dist = 90 + Math.random() * 70;
    el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    el.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
    scatterLayer.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('fly')));
    setTimeout(() => el.classList.add('settle'), 650);
  }

  setTimeout(() => {
    document.getElementById('package-scene').classList.remove('active');
    document.getElementById('goodies-scene').classList.add('active');
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  }, 1250);
}

document.getElementById('open-btn').addEventListener('click', playOpeningAnimation);

renderLabel();

/* ============================================================================
   SECRET ADMIN DOOR
   Click the small invisible spot in the bottom-right corner of the page
   5 times in a row (within 2.5 seconds) to open the admin panel.
   Default passcode is set below — change ADMIN_PASSCODE to whatever you like.
   ============================================================================ */
const ADMIN_PASSCODE = "digimail"; // <- change this to your own secret word

let doorClicks = 0;
let doorTimer = null;
document.getElementById('admin-trigger').addEventListener('click', () => {
  doorClicks++;
  clearTimeout(doorTimer);
  doorTimer = setTimeout(() => { doorClicks = 0; }, 2500);
  if (doorClicks >= 5){
    doorClicks = 0;
    openAdminGate();
  }
});
// Keyboard shortcut for desktop convenience: Ctrl+Shift+A
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') openAdminGate();
});

function openAdminGate(){
  const panel = document.getElementById('admin-panel');
  panel.innerHTML = `
    <div class="admin-passcode-gate">
      <h2>psst — admin only</h2>
      <p style="font-size:0.85rem;">enter the passcode to edit this month's package</p>
      <div class="admin-field" style="max-width:220px; margin:0 auto;">
        <input type="password" id="admin-passcode-input" placeholder="passcode">
      </div>
      <div class="admin-row" style="justify-content:center;">
        <button class="admin-btn primary" id="admin-unlock-btn">Unlock</button>
        <button class="admin-btn" id="admin-cancel-btn">Cancel</button>
      </div>
    </div>`;
  document.getElementById('admin-overlay').classList.add('open');
  document.getElementById('admin-unlock-btn').addEventListener('click', tryUnlock);
  document.getElementById('admin-passcode-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryUnlock();
  });
  document.getElementById('admin-cancel-btn').addEventListener('click', () => {
    document.getElementById('admin-overlay').classList.remove('open');
  });
  document.getElementById('admin-passcode-input').focus();
}

function tryUnlock(){
  const val = document.getElementById('admin-passcode-input').value;
  if (val === ADMIN_PASSCODE){
    renderAdminEditor();
  } else {
    const input = document.getElementById('admin-passcode-input');
    input.style.borderColor = 'var(--stamp-red)';
    input.value = '';
    input.placeholder = 'wrong passcode, try again';
  }
}

/* ---------------------------------------------------------------------------
   ADMIN EDITOR — lets you edit label info + every item, live-preview it,
   save a draft to this browser, and export the finished PACKAGE_DATA code
   to paste back into this file for the next member.
--------------------------------------------------------------------------- */
const ITEM_TYPES = ['TEXT','PHOTOCARD_SET','LINK','DOWNLOAD','CUSTOM'];

function renderAdminEditor(){
  const panel = document.getElementById('admin-panel');
  panel.innerHTML = `
    <h2>admin — edit this month's mail</h2>

    <h3>shipping label</h3>
    <div class="admin-field"><label>To</label><input id="f-toName"></div>
    <div class="admin-field"><label>From</label><input id="f-fromName"></div>
    <div class="admin-field"><label>Month / Year</label><input id="f-month"></div>
    <div class="admin-field"><label>Tracking number</label><input id="f-tracking"></div>

    <h3>items</h3>
    <div id="admin-items"></div>
    <button class="admin-btn" id="add-item-btn">+ Add item</button>

    <div class="admin-row">
      <button class="admin-btn primary" id="apply-btn">Apply &amp; preview</button>
      <button class="admin-btn" id="save-draft-btn">Save draft to this browser</button>
      <button class="admin-btn" id="load-draft-btn">Load saved draft</button>
      <button class="admin-btn" id="export-btn">Export code</button>
      <button class="admin-btn danger" id="close-admin-btn">Close</button>
    </div>
    <textarea class="admin-export" id="admin-export-box" style="display:none;" readonly></textarea>
  `;

  document.getElementById('f-toName').value = currentData.toName;
  document.getElementById('f-fromName').value = currentData.fromName;
  document.getElementById('f-month').value = currentData.month;
  document.getElementById('f-tracking').value = currentData.trackingNumber;

  renderAdminItems();

  document.getElementById('add-item-btn').addEventListener('click', () => {
    currentData.items.push({ id: 'item-' + Date.now(), type: 'TEXT', title: '', description: '', text: '' });
    renderAdminItems();
  });
  document.getElementById('apply-btn').addEventListener('click', applyAdminChanges);
  document.getElementById('save-draft-btn').addEventListener('click', () => {
    applyAdminChanges();
    localStorage.setItem('digiMailDraft', JSON.stringify(currentData));
    alert('Draft saved to this browser.');
  });
  document.getElementById('load-draft-btn').addEventListener('click', () => {
    const saved = localStorage.getItem('digiMailDraft');
    if (!saved){ alert('No saved draft found in this browser yet.'); return; }
    currentData = JSON.parse(saved);
    renderAdminEditor();
    renderLabel();
    renderGoodies();
  });
  document.getElementById('export-btn').addEventListener('click', () => {
    applyAdminChanges();
    const box = document.getElementById('admin-export-box');
    box.style.display = 'block';
    box.value = 'const PACKAGE_DATA = ' + JSON.stringify(currentData, null, 2) + ';';
    box.select();
  });
  document.getElementById('close-admin-btn').addEventListener('click', () => {
    document.getElementById('admin-overlay').classList.remove('open');
  });
}

function renderAdminItems(){
  const holder = document.getElementById('admin-items');
  holder.innerHTML = '';
  currentData.items.forEach((item, idx) => {
    const block = document.createElement('div');
    block.className = 'admin-item-block';
    block.innerHTML = `
      <div class="admin-item-head">
        <span>#${idx + 1} — ${item.id}</span>
        <div>
          <button class="admin-btn" data-move="-1" data-idx="${idx}" style="padding:4px 10px;">↑</button>
          <button class="admin-btn" data-move="1" data-idx="${idx}" style="padding:4px 10px;">↓</button>
          <button class="admin-btn danger" data-remove="${idx}" style="padding:4px 10px;">remove</button>
        </div>
      </div>
      <div class="admin-field"><label>Type</label>
        <select data-field="type" data-idx="${idx}">
          ${ITEM_TYPES.map(t => `<option value="${t}" ${t === item.type ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="admin-field"><label>Title</label><input data-field="title" data-idx="${idx}" value="${escapeHtml(item.title || '')}"></div>
      <div class="admin-field"><label>Description</label><input data-field="description" data-idx="${idx}" value="${escapeHtml(item.description || '')}"></div>
      <div class="admin-field"><label>Image URL (optional)</label><input data-field="image" data-idx="${idx}" value="${escapeHtml(item.image || '')}"></div>

      ${item.type === 'TEXT' || item.type === 'CUSTOM' ? `
      <div class="admin-field"><label>Text / note ${item.type === 'CUSTOM' ? '(one line per bullet point)' : ''}</label>
        <textarea data-field="text" data-idx="${idx}">${escapeHtml(Array.isArray(item.text) ? item.text.join('\\n') : (item.text || ''))}</textarea>
      </div>` : ''}

      ${item.type === 'LINK' || item.type === 'DOWNLOAD' || item.type === 'CUSTOM' ? `
      <div class="admin-field"><label>Link URL</label><input data-field="link" data-idx="${idx}" value="${escapeHtml(item.link || '')}"></div>
      <div class="admin-field"><label>Button label</label><input data-field="buttonLabel" data-idx="${idx}" value="${escapeHtml(item.buttonLabel || '')}"></div>` : ''}

      ${item.type === 'DOWNLOAD' ? `
      <div class="admin-field"><label><input type="checkbox" style="width:auto;" data-field="downloadable" data-idx="${idx}" ${item.downloadable ? 'checked' : ''}> Force download</label></div>` : ''}

      ${item.type === 'PHOTOCARD_SET' ? `
      <div class="admin-field"><label>Photocard image URLs (one per line)</label>
        <textarea data-field="photocards" data-idx="${idx}">${(item.photocards || []).join('\\n')}</textarea>
      </div>` : ''}
    `;
    holder.appendChild(block);
  });

  holder.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentData.items.splice(parseInt(btn.getAttribute('data-remove'), 10), 1);
      renderAdminItems();
    });
  });
  holder.querySelectorAll('[data-move]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const dir = parseInt(btn.getAttribute('data-move'), 10);
      const target = idx + dir;
      if (target < 0 || target >= currentData.items.length) return;
      const tmp = currentData.items[idx];
      currentData.items[idx] = currentData.items[target];
      currentData.items[target] = tmp;
      renderAdminItems();
    });
  });
  holder.querySelectorAll('select[data-field="type"]').forEach(sel => {
    sel.addEventListener('change', () => {
      currentData.items[parseInt(sel.getAttribute('data-idx'), 10)].type = sel.value;
      renderAdminItems();
    });
  });
}

function applyAdminChanges(){
  currentData.toName = document.getElementById('f-toName').value;
  currentData.fromName = document.getElementById('f-fromName').value;
  currentData.month = document.getElementById('f-month').value;
  currentData.trackingNumber = document.getElementById('f-tracking').value;

  document.querySelectorAll('#admin-items [data-field]').forEach(el => {
    const idx = parseInt(el.getAttribute('data-idx'), 10);
    const field = el.getAttribute('data-field');
    const item = currentData.items[idx];
    if (!item) return;
    if (field === 'downloadable'){
      item.downloadable = el.checked;
    } else if (field === 'photocards'){
      item.photocards = el.value.split('\n').map(s => s.trim()).filter(Boolean);
    } else if (field === 'text' && item.type === 'CUSTOM'){
      item.text = el.value.split('\n').map(s => s.trim()).filter(Boolean);
    } else {
      item[field] = el.value;
    }
  });

  renderLabel();
  renderGoodies();
}
</script>
